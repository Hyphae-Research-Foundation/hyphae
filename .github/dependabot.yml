version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Bogota
    open-pull-requests-limit: 5
    groups:
      rust-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: America/Bogota
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /sdks/typescript
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Bogota
  - package-ecosystem: npm
    directory: /integrations/javascript
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
      timezone: America/Bogota
  - package-ecosystem: npm
    directory: /integrations/host-smoke
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: America/Bogota
  - package-ecosystem: npm
    directory: /conformance/mcp/hosts
    schedule:
      interval: weekly
      day: monday
      time: "07:45"
      timezone: America/Bogota
