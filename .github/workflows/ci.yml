name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify the pull-request integration tree
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_MERGE_COMMIT: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "refs/pull/${PR_NUMBER}/merge"
          test "$(git rev-parse FETCH_HEAD)" = "$PR_MERGE_COMMIT"
          test "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$(git rev-parse 'HEAD^{tree}')"
      - name: Verify retained native gate closures
        run: |
          PYTHONPATH=. python -m unittest tools.test_check_native_gate_closures -v
          python tools/check_native_gate_closures.py
      - name: Verify open G7 and G8 authority
        run: |
          PYTHONPATH=. python -m unittest tools.test_check_native_g7_g8_readiness -v
          PYTHONPATH=. python tools/check_native_g7_g8_readiness.py \
            --expected-commit "$(git rev-parse HEAD)" \
            --output "$RUNNER_TEMP/native-g7-g8-readiness-audit.json"
      - name: Verify Native performance evidence contract
        run: |
          PYTHONPATH=. python -m unittest \
            tools.test_check_native_hardware_profile \
            tools.test_check_native_g7_i7i_preflight \
            tools.test_check_native_hardware_calibration \
            tools.test_check_native_execution_topology \
            tools.test_check_native_governor_policy \
            tools.test_check_native_scheduler_authority \
            tools.test_check_native_performance_receipt \
            tools.test_check_native_vector_bulk_bakeoff \
            tools.test_check_native_ann_durable_qualification \
            tools.test_run_native_ann_durable_qualification \
            tools.test_run_native_g7 \
            tools.test_run_native_performance_baseline \
            -v
      - name: Verify G6 manifests
        run: |
          PYTHONPATH=. python -m unittest tools.test_check_native_g6_foundation -v
          python tools/check_native_g6_foundation.py \
            --expected-commit "$(git rev-parse HEAD)" \
            --profile config/native-g6-readiness-profile.json \
            --evidence config/native-g6-readiness-evidence.json \
            --inventory config/native-g6-inventory.json \
            --authority config/native-g6-authority-manifest.json \
            --workload config/native-g6-workload-manifest.json \
            --suite config/native-g6-suite-manifest.json \
            --predecessor config/native-g6-predecessor-manifest.json
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Verify local durable ANN qualification
        run: |
          PYTHONPATH=. python tools/run_native_ann_durable_qualification.py \
            --expected-commit "$(git rev-parse HEAD)" \
            --output-dir "$RUNNER_TEMP/native-ann-durable-qualification"
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked
      - name: Verify Linux hardware discovery and calibration receipts
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet --locked -p hyphae-cli -- \
            hardware discover --data-dir "$RUNNER_TEMP" \
            > native-hardware-profile.json
          PYTHONPATH=. python tools/check_native_hardware_profile.py \
            --profile native-hardware-profile.json
          cargo run --quiet --locked -p hyphae-cli -- \
            hardware calibrate --data-dir "$RUNNER_TEMP" --no-cache \
            > native-hardware-calibration.json
          PYTHONPATH=. python tools/check_native_hardware_calibration.py \
            --receipt native-hardware-calibration.json

  test:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux stable
            os: ubuntu-latest
            toolchain: 1.96.0
            native-platform: linux
            run-native-conformance: true
          - name: Linux MSRV
            os: ubuntu-latest
            toolchain: 1.89.0
            native-platform: linux
            run-native-conformance: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run tests
        run: cargo test --workspace --all-features --locked
      - name: Run native conformance profile
        if: matrix.run-native-conformance
        shell: bash
        run: |
          python tools/check_native_conformance.py \
            --profile config/native-conformance-profile.json \
            --platform "${{ matrix.native-platform }}" \
            --source-commit "${{ github.event.pull_request.head.sha || github.sha }}" \
            --run \
            --output "native-conformance-${{ matrix.native-platform }}.json"
      - name: Upload native conformance receipt
        if: matrix.run-native-conformance && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-conformance-${{ matrix.native-platform }}
          path: native-conformance-${{ matrix.native-platform }}.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  test-platform-push:
    name: Test (${{ matrix.name }})
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS stable
            os: macos-latest
            toolchain: 1.96.0
            native-platform: macos
          - name: Windows stable
            os: windows-latest
            toolchain: 1.96.0
            native-platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run platform tests
        run: cargo test --workspace --all-features --locked
      - name: Run native conformance profile
        shell: bash
        run: |
          python tools/check_native_conformance.py \
            --profile config/native-conformance-profile.json \
            --platform "${{ matrix.native-platform }}" \
            --source-commit "${{ github.event.pull_request.head.sha || github.sha }}" \
            --run \
            --output "native-conformance-${{ matrix.native-platform }}.json"
      - name: Upload native conformance receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-conformance-${{ matrix.native-platform }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: native-conformance-${{ matrix.native-platform }}.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  public-clients:
    name: Public client conformance
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: 1.96.0
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          package-manager-cache: false
      - name: Install pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.11.15
      - name: Check generated SDK models
        run: |
          PYTHONPATH=. python -m unittest tools.test_generate_sdk_models -v
          python tools/generate_sdk_models.py --check
      - name: Build and test TypeScript SDK
        working-directory: sdks/typescript
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Test Python SDK
        env:
          PYTHONPATH: sdks/python/src
        run: |
          python -m compileall -q sdks/python/src sdks/python/conformance sdks/python/tests
          python -m unittest discover -s sdks/python/tests -v
      - name: Build public Rust clients and single binary
        run: cargo build -p hyphae-cli -p hyphae-conformance-rust --locked
      - name: Run common live conformance suite
        run: python tools/run_conformance.py

  optional-integrations:
    name: Optional framework integrations
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: 1.96.0
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          package-manager-cache: false
      - name: Enforce public-only integration boundaries
        run: python tools/check_integration_boundaries.py
      - name: Build public TypeScript SDK
        working-directory: sdks/typescript
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Test optional JavaScript adapters
        working-directory: integrations/javascript
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=moderate
          npm test
      - name: Prove hosts build without Hyphae
        working-directory: integrations/host-smoke
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=moderate
          npm test
      - name: Build standalone server
        run: cargo build -p hyphae-cli --locked
      - name: Run live adapter conformance
        run: python tools/run_integration_conformance.py

  release-readiness:
    name: Release readiness
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: 1.96.0
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install artifact-bound SemVer verifier
        shell: bash
        env:
          SEMVER_CHECKS_SHA256: fc0144b6cfd8820bdb4180228212c26e6ee6b58363a20849c3386a5d22e90c3d
          SEMVER_CHECKS_URL: https://github.com/obi1kenobi/cargo-semver-checks/releases/download/v0.48.0/cargo-semver-checks-x86_64-unknown-linux-gnu.tar.gz
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cargo-semver-checks-0.48.0.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$archive" "$SEMVER_CHECKS_URL"
          printf '%s  %s\n' "$SEMVER_CHECKS_SHA256" "$archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          chmod 0755 "$RUNNER_TEMP/cargo-semver-checks"
          test "$("$RUNNER_TEMP/cargo-semver-checks" --version)" = "cargo 0.48.0"
      - name: Verify major public API against v0.2.1
        shell: bash
        env:
          BASELINE_COMMIT: 08028e8dac077846c638f067ce74fbcf6fb75501
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin \
            "refs/tags/v0.2.1:refs/tags/v0.2.1"
          test "$(git rev-parse 'v0.2.1^{commit}')" = "$BASELINE_COMMIT"
          while IFS= read -r package; do
            "$RUNNER_TEMP/cargo-semver-checks" semver-checks \
              --package "$package" \
              --baseline-rev "$BASELINE_COMMIT" \
              --release-type major \
              --all-features \
              --color never
          done < <(
            python3 -c \
              'import json; print(*json.load(open("config/crates-io-release.json"))["semver_baseline_packages"], sep="\n")'
          )
      - name: Install pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.11.15
      - name: Build the standalone binary
        run: cargo build -p hyphae-cli --locked
      - name: Audit publishable crate contents
        run: python tools/check_crate_packages.py
      - name: Validate documentation and executable embedded example
        run: |
          python tools/check_documentation.py --binary target/debug/hyphae
          python tools/run_documentation_examples.py --binary target/debug/hyphae
          cargo run -p hyphae-engine --example embedded --locked -- "$RUNNER_TEMP/hyphae-doc-example"
      - name: Verify immutable historical disk compatibility fixtures
        run: |
          python tools/generate_compatibility_fixture.py --binary target/debug/hyphae --check compatibility/v1/data-directory.json
          cargo test -p hyphae-engine --example generate_disk_format_2_fixture --locked
          cargo test -p hyphae-engine --example generate_retrieval_goldens --locked
      - name: Test deterministic packaging and checksums
        run: |
          python -m compileall -q packaging tools
          python packaging/test_package.py
      - name: Install from a generated Linux archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python packaging/package.py \
            --binary target/debug/hyphae \
            --target x86_64-unknown-linux-gnu \
            --output-dir artifacts
          python packaging/verify_install.py --directory artifacts
