name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-24.04
    steps:
      - name: Check out candidate history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify the pull-request integration tree
        shell: bash
        env:
          PR_MERGE_COMMIT: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "refs/pull/${PR_NUMBER}/merge"
          test "$(git rev-parse FETCH_HEAD)" = "$PR_MERGE_COMMIT"
          test "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$(git rev-parse 'HEAD^{tree}')"
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: 1.96.0
      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          package-manager-cache: false
      - name: Install pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.11.15
      - name: Review dependency and lockfile changes
        run: |
          python -m unittest tools/test_review_dependencies.py -v
          python tools/review_dependencies.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --output dependency-review.json
      - name: Validate locked Rust dependency graphs
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          cargo metadata --manifest-path fuzz/Cargo.toml --locked --format-version 1 > /dev/null
      - name: Audit locked JavaScript dependency graphs
        shell: bash
        run: |
          set -euo pipefail
          for directory in sdks/typescript integrations/javascript integrations/host-smoke; do
            npm --prefix "$directory" ci --ignore-scripts
            npm --prefix "$directory" audit --audit-level=moderate
          done
      - name: Upload dependency review evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-review
          path: dependency-review.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true
