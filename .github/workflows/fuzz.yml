name: Fuzz

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    name: Bounded parser fuzzing
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify the pull-request integration tree
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_MERGE_COMMIT: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "refs/pull/${PR_NUMBER}/merge"
          test "$(git rev-parse FETCH_HEAD)" = "$PR_MERGE_COMMIT"
          test "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$(git rev-parse 'HEAD^{tree}')"
      - name: Install pinned nightly toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: nightly-2026-07-01
      - name: Install pinned cargo-fuzz
        run: cargo +nightly-2026-07-01 install cargo-fuzz --version 0.13.2 --locked
      - name: Install pinned fuzz dependency auditors
        run: |
          cargo +nightly-2026-07-01 install cargo-audit --version 0.22.2 --locked
          cargo +nightly-2026-07-01 install cargo-deny --version 0.20.2 --locked
      - name: Fetch the locked fuzz dependency graph
        run: cargo +nightly-2026-07-01 fetch --manifest-path fuzz/Cargo.toml --locked
      - name: Audit the isolated fuzz dependency graph
        run: |
          cargo +nightly-2026-07-01 deny --manifest-path fuzz/Cargo.toml check
          cargo +nightly-2026-07-01 audit --file fuzz/Cargo.lock --deny warnings
      - name: Fuzz canonical document decoder
        run: cargo +nightly-2026-07-01 fuzz run document_decode -- -max_total_time=15 -max_len=1048576
      - name: Fuzz result-proof decoder
        run: cargo +nightly-2026-07-01 fuzz run proof_decode -- -max_total_time=15 -max_len=1048576
      - name: Fuzz retrieval-proof decoders
        run: cargo +nightly-2026-07-01 fuzz run retrieval_proof_decode -- -max_total_time=15 -max_len=1048576
      - name: Fuzz vector request and metadata decoding
        run: cargo +nightly-2026-07-01 fuzz run vector_request_decode -- -max_total_time=15 -max_len=1048576
      - name: Fuzz lexical tokenizer, index, and hybrid request decoding
        run: cargo +nightly-2026-07-01 fuzz run lexical_hybrid_decode -- -max_total_time=15 -max_len=1048576
      - name: Fuzz snapshot verifier
        run: cargo +nightly-2026-07-01 fuzz run snapshot_verify -- -max_total_time=15 -max_len=1048576
      - name: Preserve only crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashes-${{ github.run_id }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true
