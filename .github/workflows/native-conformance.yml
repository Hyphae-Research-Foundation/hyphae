name: Native Conformance Aggregate

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: native-conformance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  aggregate:
    name: Native conformance aggregate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.11.15
      - name: Resolve successful CI run for the exact commit
        id: ci
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const sha = context.payload.pull_request?.head.sha || context.sha;
            let run;
            for (let attempt = 1; attempt <= 80; attempt++) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ci.yml',
                head_sha: sha,
                per_page: 20,
              });
              run = response.data.workflow_runs
                .filter(item => item.head_sha === sha && item.conclusion === 'success')
                .sort((a, b) => b.run_number - a.run_number)[0];
              if (run) break;
              core.info(`waiting for successful CI run for ${sha} (${attempt}/80)`);
              await new Promise(resolve => setTimeout(resolve, 30000));
            }
            if (!run) {
              core.setFailed(`missing successful CI run for ${sha}`);
              return;
            }
            core.setOutput('run_id', run.id);
      - name: Download hosted conformance receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.ci.outputs.run_id }}
          pattern: native-conformance-*
          path: conformance-receipts
          merge-multiple: true
      - name: Validate and aggregate hosted receipts
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tools/test_check_native_conformance.py -v
          python tools/check_native_conformance.py \
            --profile config/native-conformance-profile.json \
            --aggregate \
            --receipt conformance-receipts/native-conformance-linux.json \
            --receipt conformance-receipts/native-conformance-macos.json \
            --receipt conformance-receipts/native-conformance-windows.json \
            --output native-conformance-aggregate.json
      - name: Inject hosted conformance into G0 readiness
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python tools/check_native_g0_readiness.py \
            --profile config/native-g0-readiness-profile.json \
            --evidence config/native-g0-readiness-evidence.json \
            --inject-requirement local-protocol-goldens-and-conformance \
            --inject-level hosted \
            --inject-reference native-conformance-aggregate.json \
            --evidence-output native-g0-evidence-with-conformance.json \
            --output native-g0-readiness-with-conformance.json
          readiness_status=$?
          set -e
          test "$readiness_status" -eq 0 || test "$readiness_status" -eq 1
          python -m json.tool native-g0-readiness-with-conformance.json >/dev/null
      - name: Upload native conformance aggregate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-conformance-aggregate
          path: |
            native-conformance-aggregate.json
            native-g0-evidence-with-conformance.json
            native-g0-readiness-with-conformance.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true
