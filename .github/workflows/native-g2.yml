# SPDX-License-Identifier: Apache-2.0
# This pull-request lane regenerates the prepared-plans/EXPLAIN evidence and
# regression-tests the G2 evidence pipeline against an intentionally empty
# baseline: with exactly one injected requirement, the readiness checker must
# report 1/8 passed and a failed aggregate. It does not describe the current
# G2 gate status; the retained closure authority is
# docs/gates/evidence/closures/native-g2-a839037.json, and the complete
# 8/8 lane is native-g2-complete.yml.
name: Native G2 Relational

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: native-g2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  relational:
    name: G2 relational evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: "1.96.0"

      - name: Execute prepared plans and EXPLAIN suites
        shell: bash
        run: |
          set -euo pipefail
          G2_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          cargo test -p hyphae-native-runtime --lib sql::tests --locked 2>&1 | tee g2-sql-unit.log
          cargo test -p hyphae-native-runtime --test local_sql_select --locked 2>&1 | tee g2-local-sql.log
          CORPUS_SHA="$(sha256sum docs/native/sql-semantics-v1.md | cut -d' ' -f1)"
          PYTHONPATH=. python tools/produce_native_g2_prepared_receipt.py \
            --source-commit "$G2_SHA" \
            --suite-log sql-unit g2-sql-unit.log \
            --suite-log local-sql-select g2-local-sql.log \
            --corpus-sha256 "$CORPUS_SHA" \
            --output native-g2-prepared-receipt.json
          PYTHONPATH=. python tools/check_native_g2_receipts.py \
            --receipt native-g2-prepared-receipt.json \
            --expected-commit "$G2_SHA" \
            --expected-requirement prepared-plans-and-explain \
            --output native-g2-prepared-audit.json
          PYTHONPATH=. python tools/inject_native_g2_evidence.py \
            --baseline config/native-g2-readiness-evidence.json \
            --requirement prepared-plans-and-explain \
            --reference native-g2-prepared-audit.json \
            --expected-commit "$G2_SHA" \
            --output native-g2-evidence-with-prepared.json
          # Pipeline regression: the baseline evidence file is deliberately
          # empty, so injecting this run's single requirement must leave the
          # readiness checker failing with exactly 1/8 requirements passed.
          # A different exit code or count means the checker or injection
          # tooling regressed, not that the retained G2 closure changed.
          set +e
          PYTHONPATH=. python tools/check_native_g2_readiness.py \
            --profile config/native-g2-readiness-profile.json \
            --evidence native-g2-evidence-with-prepared.json \
            --output native-g2-readiness-with-prepared.json
          READINESS_STATUS=$?
          set -e
          test "$READINESS_STATUS" -eq 1
          python - <<'PY'
          import json
          receipt = json.load(open("native-g2-readiness-with-prepared.json"))
          assert receipt["status"] == "failed"
          assert receipt["required"] == 8
          assert receipt["passed"] == 1
          PY

      - name: Run G2 receipt validators
        run: |
          PYTHONPATH=. python -m unittest \
            tools.test_check_native_g2_receipts \
            tools.test_inject_native_g2_evidence \
            tools.test_produce_native_g2_prepared_receipt -v

      - name: Upload G2 prepared evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-g2-prepared-evidence
          path: |
            native-g2-prepared-receipt.json
            native-g2-prepared-audit.json
            native-g2-evidence-with-prepared.json
            native-g2-readiness-with-prepared.json
          if-no-files-found: error
