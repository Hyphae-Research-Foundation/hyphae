name: Native G3 Structure Evidence

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: native-g3-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evidence:
    name: G3 exact-SHA structure evidence
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.96.0

      - name: Install pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.11.15

      - name: Verify exact checkout and evidence tools
        shell: bash
        run: |
          set -euo pipefail
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$SHA"
          PYTHONPATH=. python -m unittest \
            tools.test_produce_native_g3_receipt \
            tools.test_check_native_g3_receipt \
            tools.test_check_native_g3_readiness -v

      - name: Execute manifest and assemble evidence
        shell: bash
        run: |
          set -euo pipefail
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          MANIFEST="config/native-g3-suite-manifest.json"
          MANIFEST_SHA="$(shasum -a 256 "$MANIFEST" | cut -d' ' -f1)"
          PLATFORM="$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m)"
          mkdir -p g3-logs g3-receipts g3-audits
          cp config/native-g3-readiness-evidence.json g3-evidence.json
          python - "$MANIFEST" "$SHA" "$MANIFEST_SHA" "$PLATFORM" <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys
          manifest_path, sha, manifest_sha, platform = sys.argv[1:]
          manifest = json.load(open(manifest_path))
          for requirement in manifest["requirements"]:
              receipt_args = []
              for suite in requirement["suites"]:
                  name = suite["name"]
                  command = suite["command"]
                  log = pathlib.Path("g3-logs") / f"{requirement['id']}--{name}.log"
                  marker = "G3_COMMAND: " + json.dumps(command, separators=(",", ":")) + "\n"
                  run_command = command
                  time_log = None
                  if requirement["id"] == "memory-amplification" and name == "amplification":
                      time_log = pathlib.Path("g3-logs") / "memory-amplification-time.log"
                      run_command = ["/usr/bin/time", "-v", "-o", str(time_log), *command]
                  with log.open("w") as output:
                      output.write(marker)
                      output.flush()
                      subprocess.run(run_command, stdout=output, stderr=subprocess.STDOUT, check=True)
                  receipt_args.extend(["--suite-log", name, str(log)])
              if requirement["id"] == "memory-amplification":
                  time_text = (pathlib.Path("g3-logs") / "memory-amplification-time.log").read_text()
                  line = next(line for line in time_text.splitlines() if "Maximum resident set size" in line)
                  peak = int(line.rsplit(":", 1)[1].strip())
                  receipt_args.extend(["--peak-rss-kib", str(peak)])
              receipt = pathlib.Path("g3-receipts") / f"{requirement['id']}.json"
              subprocess.run([
                  sys.executable, "tools/produce_native_g3_receipt.py",
                  "--requirement", requirement["id"], "--source-commit", sha,
                  "--manifest", manifest_path, "--manifest-sha256", manifest_sha,
                  "--platform", platform, "--toolchain", "1.96.0", *receipt_args,
                  "--output", str(receipt),
              ], check=True)
          PY
          while IFS= read -r requirement; do
            python tools/check_native_g3_receipt.py \
              --receipt "g3-receipts/$requirement.json" \
              --expected-commit "$SHA" --expected-requirement "$requirement" \
              --manifest-sha256 "$MANIFEST_SHA" \
              --output "g3-audits/$requirement.json"
            python tools/inject_native_g3_evidence.py \
              --baseline g3-evidence.json --requirement "$requirement" \
              --reference "g3-audits/$requirement.json" \
              --expected-commit "$SHA" --output g3-evidence-next.json
            mv g3-evidence-next.json g3-evidence.json
          done < <(python -c 'import json; print("\n".join(r["id"] for r in json.load(open("config/native-g3-suite-manifest.json"))["requirements"]))')
          python tools/check_native_g3_readiness.py \
            --profile config/native-g3-readiness-profile.json \
            --evidence g3-evidence.json --expected-commit "$SHA" \
            --manifest-sha256 "$MANIFEST_SHA" \
            --output native-g3-readiness.json

      - name: Upload exact-SHA G3 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-g3-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: |
            g3-logs/
            g3-receipts/
            g3-audits/
            g3-evidence.json
            native-g3-readiness.json
            config/native-g3-suite-manifest.json
