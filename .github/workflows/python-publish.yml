name: Python package

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Existing immutable annotated release tag
        required: true
        type: string
      repository:
        description: Registry selected for this one publication
        required: true
        type: choice
        options:
          - testpypi
          - pypi

concurrency:
  group: python-package-${{ inputs.repository }}-${{ inputs.source_tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build exact Python distributions
    runs-on: ubuntu-24.04
    outputs:
      source-commit: ${{ steps.source.outputs.commit }}
      source-date-epoch: ${{ steps.source.outputs.epoch }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - name: Check out immutable source tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.source_tag }}
          fetch-depth: 0
      - name: Bind version to annotated tag and exact commit
        id: source
        shell: bash
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git cat-file -t "refs/tags/$SOURCE_TAG")" = tag
          source_commit="$(git rev-parse "refs/tags/$SOURCE_TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$source_commit"
          version="$(python -c 'import tomllib; print(tomllib.load(open("sdks/python/pyproject.toml", "rb"))["project"]["version"])')"
          test "$SOURCE_TAG" = "v$version"
          echo "commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git show -s --format=%ct "$source_commit")" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.11.15
      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          enable-cache: false
      - name: Test and build from exact source
        env:
          PYTHONPATH: sdks/python/src
          SOURCE_DATE_EPOCH: ${{ steps.source.outputs.epoch }}
        run: |
          set -euo pipefail
          python -m compileall -q sdks/python/src sdks/python/conformance sdks/python/tests
          python -m unittest discover -s sdks/python/tests -v
          PYTHONPATH=. python -m unittest \
            tools.test_check_python_package \
            tools.test_check_python_distributions \
            tools.test_normalize_python_sdist \
            tools.test_python_distribution_receipt -v
          PYTHONPATH=. python tools/check_python_package.py
          uv build sdks/python --out-dir dist
          python tools/normalize_python_sdist.py \
            --path "dist/hyphae_sdk-${{ steps.source.outputs.version }}.tar.gz" \
            --source-date-epoch "${{ steps.source.outputs.epoch }}"
          python tools/check_python_distributions.py \
            --directory dist \
            --expected-version "${{ steps.source.outputs.version }}"
          python tools/python_distribution_receipt.py build \
            --directory dist \
            --version "${{ steps.source.outputs.version }}" \
            --source-tag "${{ inputs.source_tag }}" \
            --source-commit "${{ steps.source.outputs.commit }}" \
            --output python-distribution-receipt.json
      - name: Upload exact distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hyphae-python-${{ steps.source.outputs.commit }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            python-distribution-receipt.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    name: Publish to ${{ inputs.repository }} with OIDC
    needs: build
    runs-on: ubuntu-24.04
    environment: ${{ inputs.repository }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download exact distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hyphae-python-${{ needs.build.outputs.source-commit }}
          path: release
      - name: Publish distributions to TestPyPI
        if: inputs.repository == 'testpypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release/dist/
          repository-url: https://test.pypi.org/legacy/
          attestations: true
      - name: Publish distributions to PyPI
        if: inputs.repository == 'pypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release/dist/
          attestations: true

  verify:
    name: Verify published registry release
    needs:
      - build
      - publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out receipt verifier from immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.source_tag }}
          fetch-depth: 1
      - name: Rebind verifier to exact source
        run: test "$(git rev-parse HEAD)" = "${{ needs.build.outputs.source-commit }}"
      - name: Download exact build receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hyphae-python-${{ needs.build.outputs.source-commit }}
          path: release
      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          enable-cache: false
      - name: Install released wheel on supported Python boundaries
        shell: bash
        env:
          REPOSITORY: ${{ inputs.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          case "$REPOSITORY" in
            testpypi) index="https://test.pypi.org/simple/" ;;
            pypi) index="https://pypi.org/simple/" ;;
            *) exit 1 ;;
          esac
          for python_version in 3.11 3.14; do
            environment="verify-${python_version}"
            uv venv --python "$python_version" "$environment"
            uv pip install \
              --python "$environment/bin/python" \
              --index-url "$index" \
              --no-deps \
              "hyphae-sdk==$VERSION"
            "$environment/bin/python" -I -c \
              "import hyphae_sdk; from hyphae_sdk.v2 import HyphaeClient; assert hyphae_sdk.__version__ == '$VERSION'; assert HyphaeClient.__name__ == 'HyphaeClient'"
          done
      - name: Verify registry bytes and publish receipt
        env:
          REPOSITORY: ${{ inputs.repository }}
        run: |
          python tools/python_distribution_receipt.py verify \
            --receipt release/python-distribution-receipt.json \
            --repository "$REPOSITORY" \
            --python-version 3.11 \
            --python-version 3.14 \
            --output python-publish-receipt.json
      - name: Upload publication receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hyphae-python-${{ inputs.repository }}-${{ needs.build.outputs.source-commit }}
          path: python-publish-receipt.json
          if-no-files-found: error
          retention-days: 90
