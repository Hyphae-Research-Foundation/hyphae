# SPDX-License-Identifier: Apache-2.0
name: Release

on:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable tag to recover after a failed tag run
        required: false
        type: string
      release_commit:
        description: Exact commit targeted by the recovery tag
        required: false
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.target }}
    env:
      RELEASE_SOURCE_COMMIT: ${{ inputs.release_commit || github.event.pull_request.head.sha || github.sha }}
      RELEASE_SOURCE_REF: ${{ inputs.release_tag || github.event.pull_request.head.sha || github.sha }}
      RECOVERY_TAG: ${{ inputs.release_tag }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/dist/hyphae
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/dist/hyphae
          - os: macos-14
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/dist/hyphae
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/dist/hyphae.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SOURCE_REF }}
          fetch-depth: 1
      - name: Validate release source selection
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE_COMMIT"
          if [[ -n "$RECOVERY_TAG" ]]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test -n "${{ inputs.release_commit }}"
          else
            test -z "${{ inputs.release_commit }}"
          fi
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.target }}
      - name: Build native single binary
        run: cargo build --profile dist -p hyphae-cli --target ${{ matrix.target }} --locked
      - name: Build deterministic release archive
        run: python packaging/package.py --binary "${{ matrix.binary }}" --target "${{ matrix.target }}" --output-dir artifacts
      - name: Execute the installed native archive offline
        shell: bash
        run: |
          set -euo pipefail
          python packaging/verify_install.py \
            --directory artifacts \
            --source-commit "$RELEASE_SOURCE_COMMIT" \
            --platform "${{ matrix.target }}" \
            --output "native-g8-installed-package-${{ matrix.target }}.json"
          PYTHONPATH=. python tools/produce_native_g8_receipt.py \
            --requirement multiplatform-packaging \
            --platform "${{ matrix.target }}" \
            --expected-commit "$RELEASE_SOURCE_COMMIT" \
            --artifact "native-g8-installed-package-${{ matrix.target }}.json" \
            --output "native-g8-package-${{ matrix.target }}-receipt.json"
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.1
      - name: Generate, attest, and verify native build provenance
        shell: bash
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          archive="$(find artifacts -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print -quit)"
          test -n "$archive"
          predicate="${archive}.provenance.json"
          bundle="${archive}.intoto.sigstore.json"
          python packaging/provenance.py \
            --target "${{ matrix.target }}" \
            --commit "$RELEASE_SOURCE_COMMIT" \
            --git-ref "${{ github.ref }}" \
            --invocation-id "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}" \
            --runner-os "${{ runner.os }}" \
            --runner-arch "${{ runner.arch }}" \
            --output "$predicate"
          cosign attest-blob --yes \
            --predicate "$predicate" \
            --type slsaprovenance1 \
            --bundle "$bundle" \
            "$archive"
          cosign verify-blob-attestation \
            --bundle "$bundle" \
            --type slsaprovenance1 \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$archive"
      - name: Upload native archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hyphae-native-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true
      - name: Upload G8 package evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-g8-package-${{ matrix.target }}-${{ env.RELEASE_SOURCE_COMMIT }}
          path: |
            native-g8-installed-package-${{ matrix.target }}.json
            native-g8-package-${{ matrix.target }}-receipt.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  assemble:
    name: Assemble and verify release candidate
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      checks: read
      contents: read
      id-token: write
      pull-requests: read
    env:
      CONTROL_PACKAGING: packaging
      RECOVERY_COMMIT: ${{ inputs.release_commit }}
      RECOVERY_TAG: ${{ inputs.release_tag }}
      RELEASE_SOURCE_COMMIT: ${{ inputs.release_commit || github.event.pull_request.head.sha || github.sha }}
      RELEASE_SOURCE_REF: ${{ inputs.release_tag || github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SOURCE_REF }}
          fetch-depth: 0
      - name: Check out recovery control plane
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && inputs.release_commit != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-control
          fetch-depth: 1
      - name: Bind recovery control plane to source checkout
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && inputs.release_commit != ''
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .release-control rev-parse HEAD)" = "$GITHUB_SHA"
          control_root="$RUNNER_TEMP/release-control"
          mv .release-control "$control_root"
          echo "CONTROL_PACKAGING=$control_root/packaging" >> "$GITHUB_ENV"
          echo "HYPHAE_RELEASE_SOURCE_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Verify the pull-request integration tree
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_MERGE_COMMIT: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "refs/pull/${PR_NUMBER}/merge"
          test "$(git rev-parse FETCH_HEAD)" = "$PR_MERGE_COMMIT"
          test "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$(git rev-parse 'HEAD^{tree}')"
      - name: Download native archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: hyphae-native-*
          path: dist
          merge-multiple: true
      - name: Resolve and validate release version
        shell: bash
        env:
          RELEASE_COMMIT_INPUT: ${{ env.RELEASE_SOURCE_COMMIT }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT_INPUT"
          release_tag="$(python "$CONTROL_PACKAGING/finalize_release.py" --print-expected-tag)"
          if [[ -n "$RECOVERY_TAG" || -n "$RECOVERY_COMMIT" ]]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test -n "$RECOVERY_TAG"
            test -n "$RECOVERY_COMMIT"
            test "$RECOVERY_TAG" = "$release_tag"
            test "$RECOVERY_COMMIT" = "$RELEASE_COMMIT_INPUT"
            git fetch --force --no-tags origin \
              "+refs/tags/${release_tag}:refs/hyphae/release-tag"
            tag_object="$(git rev-parse refs/hyphae/release-tag)"
            tag_target="$(git rev-parse 'refs/hyphae/release-tag^{commit}')"
            test "$tag_target" = "$RELEASE_COMMIT_INPUT"
            git fetch --force --no-tags origin \
              "+refs/heads/main:refs/remotes/origin/main"
            git merge-base --is-ancestor \
              "$RELEASE_COMMIT_INPUT" refs/remotes/origin/main
            echo "RELEASE_TAG_OBJECT=$tag_object" >> "$GITHUB_ENV"
            echo "RELEASE_TAG_TARGET=$tag_target" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "$release_tag"
            git fetch --force --no-tags origin \
              "+refs/tags/${release_tag}:refs/hyphae/release-tag"
            tag_object="$(git rev-parse refs/hyphae/release-tag)"
            tag_target="$(git rev-parse 'refs/hyphae/release-tag^{commit}')"
            test "$tag_target" = "$RELEASE_COMMIT_INPUT"
            echo "RELEASE_TAG_OBJECT=$tag_object" >> "$GITHUB_ENV"
            echo "RELEASE_TAG_TARGET=$tag_target" >> "$GITHUB_ENV"
          fi
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == tag ]]; then
            git fetch --force --no-tags origin \
              "+refs/heads/main:refs/remotes/origin/main"
            git merge-base --is-ancestor \
              "$RELEASE_COMMIT_INPUT" refs/remotes/origin/main
          fi
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "RELEASE_COMMIT=$RELEASE_COMMIT_INPUT" >> "$GITHUB_ENV"
      - name: Install pinned Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.46.0
      - name: Generate manifest-backed release SBOMs
        shell: bash
        run: |
          set -euo pipefail
          syft="${{ steps.syft.outputs.cmd }}"
          native_sbom="${RUNNER_TEMP}/hyphae-${RELEASE_TAG}.syft.json"
          spdx_sbom="dist/hyphae-${RELEASE_TAG}.spdx.json"
          cyclonedx_sbom="dist/hyphae-${RELEASE_TAG}.cdx.json"
          "$syft" scan dir:. -o "syft-json=${native_sbom}"
          python packaging/conclude_release_sbom_licenses.py \
            --input "$native_sbom" \
            --root .
          "$syft" convert "$native_sbom" -o "spdx-json=${spdx_sbom}"
          "$syft" convert "$native_sbom" -o "cyclonedx-json=${cyclonedx_sbom}"
      - name: Bind successful hosted checks for a tag
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && inputs.release_commit != '')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_RUN_ID: ${{ github.run_id }}
        run: |
          report_path="dist/hyphae-${RELEASE_TAG}.required-checks.json"
          python "$CONTROL_PACKAGING/required_checks.py" \
            --repository "$RELEASE_REPOSITORY" \
            --commit "$RELEASE_COMMIT" \
            --exclude-run-id "$RELEASE_RUN_ID" \
            --output "$report_path"
          read -r base_sha head_sha merge_commit < <(
            python -c \
              'import json,sys; p=json.load(open(sys.argv[1], encoding="utf-8"))["pull_request"]; print(p["base_sha"], p["head_sha"], p["merge_commit_sha"])' \
              "$report_path"
          )
          test "$(git rev-parse "${merge_commit}^1")" = "$base_sha"
          test "$(git rev-parse "${merge_commit}^2")" = "$head_sha"
          test "$merge_commit" = "$RELEASE_COMMIT"
          test "$(git rev-parse "${merge_commit}^{tree}")" = \
            "$(git rev-parse "${head_sha}^{tree}")"
          git merge-base --is-ancestor "$merge_commit" refs/remotes/origin/main
      - name: Generate post-commit release evidence
        shell: bash
        run: |
          set -euo pipefail
          arguments=(
            --directory dist
            --output "dist/hyphae-${RELEASE_TAG}.release-evidence.json"
            --tag "$RELEASE_TAG"
            --commit "$RELEASE_COMMIT"
            --workflow-ref "$GITHUB_REF"
            --event "$GITHUB_EVENT_NAME"
            --run-id "$GITHUB_RUN_ID"
            --run-attempt "$GITHUB_RUN_ATTEMPT"
          )
          if [[ -n "${RELEASE_TAG_OBJECT:-}" ]]; then
            arguments+=(
              --tag-object "$RELEASE_TAG_OBJECT"
              --tag-target "$RELEASE_TAG_TARGET"
            )
          fi
          python "$CONTROL_PACKAGING/release_evidence.py" generate "${arguments[@]}"
      - name: Validate tag and create checksums
        run: python "$CONTROL_PACKAGING/finalize_release.py" --directory dist --tag "${{ env.RELEASE_TAG }}"
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.1
      - name: Sign and verify every release asset
        shell: bash
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          spdx="dist/hyphae-${RELEASE_TAG}.spdx.json"
          cyclonedx="dist/hyphae-${RELEASE_TAG}.cdx.json"
          for archive in dist/*.tar.gz dist/*.zip; do
            cosign attest-blob --yes \
              --predicate "$spdx" --type spdxjson \
              --bundle "${archive}.spdx.attestation.sigstore.json" \
              "$archive"
            cosign verify-blob-attestation \
              --bundle "${archive}.spdx.attestation.sigstore.json" \
              --type spdxjson \
              --certificate-identity "$CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$archive"
            cosign attest-blob --yes \
              --predicate "$cyclonedx" --type cyclonedx \
              --bundle "${archive}.cyclonedx.attestation.sigstore.json" \
              "$archive"
            cosign verify-blob-attestation \
              --bundle "${archive}.cyclonedx.attestation.sigstore.json" \
              --type cyclonedx \
              --certificate-identity "$CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$archive"
          done
          for artifact in dist/*; do
            case "$artifact" in
              *.sigstore.json) continue ;;
            esac
            cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "$artifact"
            cosign verify-blob \
              --bundle "${artifact}.sigstore.json" \
              --certificate-identity "$CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$artifact"
          done
      - name: Recheck release checksums
        run: python "$CONTROL_PACKAGING/finalize_release.py" --directory dist --tag "${{ env.RELEASE_TAG }}" --verify
      - name: Produce cryptographically verified G8 release receipt
        shell: bash
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          arguments=(
            --directory dist
            --commit "$RELEASE_COMMIT"
            --tag "$RELEASE_TAG"
            --certificate-identity "$CERTIFICATE_IDENTITY"
            --output native-g8-signed-release.json
          )
          if [[ -n "${RELEASE_TAG_OBJECT:-}" ]]; then
            arguments+=(
              --tag-object "$RELEASE_TAG_OBJECT"
              --tag-target "$RELEASE_TAG_TARGET"
            )
          fi
          PYTHONPATH="$CONTROL_PACKAGING" python "$CONTROL_PACKAGING/g8_release_verification.py" \
            "${arguments[@]}"
          PYTHONPATH=. python tools/produce_native_g8_receipt.py \
            --requirement sbom-signatures-provenance \
            --platform release \
            --expected-commit "$RELEASE_COMMIT" \
            --artifact native-g8-signed-release.json \
            --output native-g8-signed-release-receipt.json
      - name: Upload verified release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hyphae-release-candidate
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true
      - name: Upload G8 signed release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-g8-signed-release-${{ env.RELEASE_COMMIT }}
          path: |
            native-g8-signed-release.json
            native-g8-signed-release-receipt.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
          overwrite: true

  publish:
    name: Publish GitHub release
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && inputs.release_commit != '')
    needs: assemble
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: read
    env:
      CONTROL_PACKAGING: packaging
      RELEASE_COMMIT: ${{ inputs.release_commit || github.sha }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          fetch-depth: 0
      - name: Check out recovery control plane
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && inputs.release_commit != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-control
          fetch-depth: 1
      - name: Bind recovery control plane to source checkout
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && inputs.release_commit != ''
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .release-control rev-parse HEAD)" = "$GITHUB_SHA"
          control_root="$RUNNER_TEMP/release-control"
          mv .release-control "$control_root"
          echo "CONTROL_PACKAGING=$control_root/packaging" >> "$GITHUB_ENV"
          echo "HYPHAE_RELEASE_SOURCE_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Download verified release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hyphae-release-candidate
          path: dist
      - name: Recheck tag identity, main ancestry, evidence, and checksums
        shell: bash
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "v1.2.0"
          PYTHONPATH="$CONTROL_PACKAGING" python -c \
            'import os; from finalize_release import require_apache_release_version; require_apache_release_version(os.environ["RELEASE_TAG"].removeprefix("v"))'
          git fetch --force --no-tags origin \
            "+refs/tags/${RELEASE_TAG}:refs/hyphae/publish-tag"
          tag_object="$(git rev-parse refs/hyphae/publish-tag)"
          tag_target="$(git rev-parse 'refs/hyphae/publish-tag^{commit}')"
          test "$tag_target" = "$RELEASE_COMMIT"
          git fetch --force --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main"
          git merge-base --is-ancestor "$RELEASE_COMMIT" refs/remotes/origin/main
          python "$CONTROL_PACKAGING/release_evidence.py" verify \
            --directory dist \
            --manifest "dist/hyphae-${RELEASE_TAG}.release-evidence.json" \
            --commit "$RELEASE_COMMIT" \
            --tag-object "$tag_object" \
            --tag-target "$tag_target"
          python "$CONTROL_PACKAGING/finalize_release.py" \
            --directory dist --tag "$RELEASE_TAG" --verify
          echo "RELEASE_TAG_OBJECT=$tag_object" >> "$GITHUB_ENV"
          echo "RELEASE_TAG_TARGET=$tag_target" >> "$GITHUB_ENV"
      - name: Recheck hosted checks and create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          comparison_dir="$(mktemp -d)"
          trap 'rm -f "$comparison_dir/required-checks.json"; rmdir "$comparison_dir"' EXIT
          python "$CONTROL_PACKAGING/required_checks.py" \
            --repository "${{ github.repository }}" \
            --commit "$RELEASE_COMMIT" \
            --exclude-run-id "${{ github.run_id }}" \
            --output "$comparison_dir/required-checks.json"
          if ! cmp -s \
            "$comparison_dir/required-checks.json" \
            "dist/hyphae-${RELEASE_TAG}.required-checks.json"; then
            echo "hosted required checks changed after assemble" >&2
            exit 1
          fi
          git fetch --force --no-tags origin \
            "+refs/tags/${RELEASE_TAG}:refs/hyphae/publish-tag"
          test "$(git rev-parse refs/hyphae/publish-tag)" = \
            "$RELEASE_TAG_OBJECT"
          test "$(git rev-parse 'refs/hyphae/publish-tag^{commit}')" = \
            "$RELEASE_TAG_TARGET"
          git fetch --force --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main"
          git merge-base --is-ancestor \
            "$RELEASE_TAG_TARGET" refs/remotes/origin/main
          report_path="dist/hyphae-${RELEASE_TAG}.required-checks.json"
          read -r base_sha head_sha merge_commit < <(
            python -c \
              'import json,sys; p=json.load(open(sys.argv[1], encoding="utf-8"))["pull_request"]; print(p["base_sha"], p["head_sha"], p["merge_commit_sha"])' \
              "$report_path"
          )
          test "$(git rev-parse "${merge_commit}^1")" = "$base_sha"
          test "$(git rev-parse "${merge_commit}^2")" = \
            "$head_sha"
          test "$merge_commit" = "$RELEASE_TAG_TARGET"
          test "$(git rev-parse "${merge_commit}^{tree}")" = \
            "$(git rev-parse "${head_sha}^{tree}")"
          git merge-base --is-ancestor \
            "$merge_commit" refs/remotes/origin/main
          arguments=(--verify-tag --generate-notes --title "Hyphae ${RELEASE_TAG}")
          if [[ "$RELEASE_TAG" == *-* ]]; then
            arguments+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/* "${arguments[@]}"
