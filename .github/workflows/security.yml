name: Security

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  policy:
    name: Dependency and license policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify the pull-request integration tree
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_MERGE_COMMIT: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "refs/pull/${PR_NUMBER}/merge"
          test "$(git rev-parse FETCH_HEAD)" = "$PR_MERGE_COMMIT"
          test "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$(git rev-parse 'HEAD^{tree}')"
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: 1.96.0
      - name: Audit Rust dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enforce dependency policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      - name: Install pinned receipt tools
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-geiger --version 0.13.0 --locked
      - name: Audit the exact native runtime closure
        run: |
          python -m unittest tools/test_check_native_dependencies.py -v
          python tools/check_native_dependencies.py \
            --require-clean \
            --output native-dependency-audit.json
      - name: Audit native golden inventory
        run: |
          python -m unittest tools/test_check_native_goldens.py -v
          python tools/check_native_goldens.py \
            --inventory config/native-golden-inventory.json \
            --requirements config/native-golden-requirements.json \
            --output native-golden-audit.json
          python -m json.tool native-golden-audit.json >/dev/null
          python -m unittest tools/test_check_native_quality_corpus -v
          cargo run -p hyphae-native-runtime \
            --example lexical_quality_receipt --locked -- \
            "$(git rev-parse HEAD)" > native-lexical-quality.json
          python tools/check_native_quality_corpus.py \
            --lexical-receipt native-lexical-quality.json \
            --ann-receipt docs/gates/evidence/native-ann-kernel-wsl2.json \
            --output native-quality-aggregate.json
          python -m json.tool native-quality-aggregate.json >/dev/null
          set +e
          python tools/check_native_g0_readiness.py \
            --profile config/native-g0-readiness-profile.json \
            --evidence config/native-g0-readiness-evidence.json \
            --inject-requirement page-row-blob-wal-mvcc-goldens \
            --inject-level hosted \
            --inject-reference native-golden-audit.json \
            --evidence-output native-g0-evidence-with-goldens.json \
            --output native-g0-readiness-with-goldens.json
          golden_readiness_status=$?
          set -e
          test "$golden_readiness_status" -eq 0 || test "$golden_readiness_status" -eq 1
          python -m json.tool native-g0-readiness-with-goldens.json >/dev/null
          set +e
          python tools/check_native_g0_readiness.py \
            --profile config/native-g0-readiness-profile.json \
            --evidence native-g0-evidence-with-goldens.json \
            --inject-requirement benchmark-and-quality-corpus \
            --inject-level hosted \
            --inject-reference native-quality-aggregate.json \
            --evidence-output native-g0-evidence-with-quality.json \
            --output native-g0-readiness-with-quality.json
          quality_readiness_status=$?
          set -e
          test "$quality_readiness_status" -eq 0 || test "$quality_readiness_status" -eq 1
          python -m json.tool native-g0-readiness-with-quality.json >/dev/null
      - name: Upload native golden evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-golden-audit
          path: |
            native-golden-audit.json
            native-lexical-quality.json
            native-quality-aggregate.json
            native-g0-evidence-with-goldens.json
            native-g0-readiness-with-goldens.json
            native-g0-evidence-with-quality.json
            native-g0-readiness-with-quality.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Audit canonical native types
        shell: bash
        run: |
          set -euo pipefail
          cargo test \
            -p hyphae-native-types \
            -p hyphae-native-records \
            -p hyphae-native-pages \
            -p hyphae-native-wal \
            -p hyphae-native-runtime \
            --test scalar_goldens --locked
          cargo test -p hyphae-native-types --locked
          grep -q canonical_value_golden_fixtures \
            crates/hyphae-native-types/src/lib.rs
          python - <<'PY' > native-types-audit.json
          import hashlib, json, pathlib, subprocess
          files = [
              "Cargo.lock",
              "crates/hyphae-native-types/src/lib.rs",
              "crates/hyphae-native-records/tests/scalar_goldens.rs",
              "crates/hyphae-native-pages/tests/scalar_goldens.rs",
              "crates/hyphae-native-wal/tests/scalar_goldens.rs",
              "crates/hyphae-native-runtime/tests/scalar_goldens.rs",
          ]
          print(json.dumps({
              "schema": "hyphae-native-types-audit-v1",
              "status": "passed",
              "source_commit": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "fixture_count": 17,
              "consumers": ["records", "pages", "wal", "local-protocol"],
              "artifacts": {
                  path: hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
                  for path in files
              },
          }, indent=2, sort_keys=True))
          PY
          python -m json.tool native-types-audit.json >/dev/null
          python -m unittest tools.test_check_native_contract_conformance -v
          python tools/check_native_contract_conformance.py \
            --inventory config/native-contract-conformance.json \
            --output native-contract-conformance.json
          python -m json.tool native-contract-conformance.json >/dev/null
          set +e
          python tools/check_native_g0_readiness.py \
            --profile config/native-g0-readiness-profile.json \
            --evidence config/native-g0-readiness-evidence.json \
            --inject-requirement canonical-type-goldens-and-properties \
            --inject-level hosted \
            --inject-reference native-types-audit.json \
            --evidence-output native-g0-evidence-with-types.json \
            --output native-g0-readiness-with-types.json
          types_readiness_status=$?
          python tools/check_native_g0_readiness.py \
            --profile config/native-g0-readiness-profile.json \
            --evidence native-g0-evidence-with-types.json \
            --inject-requirement sql-structure-search-ann-contracts \
            --inject-level hosted \
            --inject-reference native-contract-conformance.json \
            --evidence-output native-g0-evidence-with-contracts.json \
            --output native-g0-readiness-with-contracts.json
          contracts_readiness_status=$?
          set -e
          test "$types_readiness_status" -eq 0 || test "$types_readiness_status" -eq 1
          test "$contracts_readiness_status" -eq 0 || test "$contracts_readiness_status" -eq 1
          python -m json.tool native-g0-readiness-with-types.json >/dev/null
          python -m json.tool native-g0-readiness-with-contracts.json >/dev/null
      - name: Inject hosted dependency evidence into G0
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python tools/check_native_g0_readiness.py \
            --profile config/native-g0-readiness-profile.json \
            --evidence config/native-g0-readiness-evidence.json \
            --inject-requirement native-dependency-license-unsafe-audit \
            --inject-level external-governance \
            --inject-reference native-dependency-audit.json \
            --evidence-output native-g0-evidence-with-dependencies.json \
            --output native-g0-readiness-with-dependencies.json
          dependency_readiness_status=$?
          set -e
          test "$dependency_readiness_status" -eq 0 || test "$dependency_readiness_status" -eq 1
          python -m json.tool native-g0-readiness-with-dependencies.json >/dev/null
      - name: Generate clean-room evidence when externally approved
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tools/test_check_native_clean_room.py -v
          if [ "$(python -c 'import json; print(len(json.load(open("config/native-clean-room-profile.json"))["human_reviewers"]))')" -eq 0 ]; then
            printf '%s\n' '{"schema":"hyphae-native-clean-room-receipt-v1","status":"blocked","reason":"human-review-required"}' \
              > native-clean-room-receipt.json
          else
            python tools/check_native_clean_room.py \
              --profile config/native-clean-room-profile.json \
              --output native-clean-room-receipt.json
          fi
          set +e
          if python -c 'import json; raise SystemExit(0 if json.load(open("native-clean-room-receipt.json"))["status"] == "passed" else 1)'; then
            python tools/check_native_g0_readiness.py \
              --profile config/native-g0-readiness-profile.json \
              --evidence config/native-g0-readiness-evidence.json \
              --inject-requirement clean-room-porting-ledger-review \
              --inject-level external-governance \
              --inject-reference native-clean-room-receipt.json \
              --evidence-output native-g0-evidence-with-clean-room.json \
              --output native-g0-readiness-with-clean-room.json
            clean_room_readiness_status=$?
          else
            clean_room_readiness_status=1
            python tools/check_native_g0_readiness.py \
              --profile config/native-g0-readiness-profile.json \
              --evidence config/native-g0-readiness-evidence.json \
              --output native-g0-readiness-with-clean-room.json
          fi
          set -e
          test "$clean_room_readiness_status" -eq 0 || test "$clean_room_readiness_status" -eq 1
          python -m json.tool native-clean-room-receipt.json >/dev/null
          python -m json.tool native-g0-readiness-with-clean-room.json >/dev/null
      - name: Audit accepted native specification set
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tools/test_check_native_specifications.py -v
          python tools/check_native_specifications.py \
            --profile config/native-specification-profile.json \
            --output native-specification-receipt.json
          set +e
          python tools/check_native_g0_readiness.py \
            --profile config/native-g0-readiness-profile.json \
            --evidence config/native-g0-readiness-evidence.json \
            --inject-requirement architecture-and-versioned-specifications \
            --inject-level hosted \
            --inject-reference native-specification-receipt.json \
            --evidence-output native-g0-evidence-with-specifications.json \
            --output native-g0-readiness-with-specifications.json
          specification_readiness_status=$?
          set -e
          test "$specification_readiness_status" -eq 0 || test "$specification_readiness_status" -eq 1
          python -m json.tool native-g0-readiness-with-specifications.json >/dev/null
      - name: Assess native G0 readiness
        run: |
          python -m unittest tools/test_check_native_g0_readiness.py -v
          set +e
          python tools/check_native_g0_readiness.py \
            --profile config/native-g0-readiness-profile.json \
            --evidence config/native-g0-readiness-evidence.json \
            --output native-g0-readiness.json
          status=$?
          set -e
          test "$status" -eq 0 || test "$status" -eq 1
          python -m json.tool native-g0-readiness.json >/dev/null
      - name: Upload accepted specification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-specification-evidence
          path: |
            native-specification-receipt.json
            native-g0-evidence-with-specifications.json
            native-g0-readiness-with-specifications.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Upload clean-room evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-clean-room-evidence
          path: |
            native-clean-room-receipt.json
            native-g0-readiness-with-clean-room.json
            native-g0-evidence-with-clean-room.json
          if-no-files-found: warn
          retention-days: 14
          overwrite: true
      - name: Upload canonical native type evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-types-audit
          path: |
            native-types-audit.json
            native-contract-conformance.json
            native-g0-evidence-with-types.json
            native-g0-readiness-with-types.json
            native-g0-evidence-with-contracts.json
            native-g0-readiness-with-contracts.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Upload native G0 readiness
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-g0-readiness
          path: native-g0-readiness.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Upload native dependency evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-dependency-audit
          path: |
            native-dependency-audit.json
            native-g0-evidence-with-dependencies.json
            native-g0-readiness-with-dependencies.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Scan repository history for secrets
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          extra_args: --results=verified,unknown