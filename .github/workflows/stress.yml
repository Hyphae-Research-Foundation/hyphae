name: Stress

on:
  pull_request:
  schedule:
    - cron: "43 3 * * 2"
  workflow_dispatch:

concurrency:
  group: stress-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stress:
    name: Load and kill/restart soak
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify the pull-request integration tree
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_MERGE_COMMIT: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "refs/pull/${PR_NUMBER}/merge"
          test "$(git rev-parse FETCH_HEAD)" = "$PR_MERGE_COMMIT"
          test "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$(git rev-parse 'HEAD^{tree}')"
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: 1.96.0
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build standalone binary
        run: cargo build -p hyphae-cli --locked
      - name: Run bounded concurrent load gate
        run: python tools/run_load_gate.py
      - name: Unit-test block power-loss harness safety
        run: |
          python -m unittest tools/test_run_native_power_loss_gate.py -v
          cargo test --locked -p hyphae-native-runtime \
            --example process_crash_matrix
      - name: Run native process-kill crash matrix
        run: |
          cargo run --locked -p hyphae-native-runtime \
            --example process_crash_matrix -- \
            "$(git rev-parse HEAD)" \
            "github-actions-ubuntu-24.04"
      - name: Run kill/restart and backup/restore soak gate
        run: python tools/run_soak_gate.py
