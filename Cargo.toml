# SPDX-License-Identifier: Apache-2.0
[workspace]
resolver = "2"
exclude = ["embed", "fuzz"]
members = [
    "conformance/g8/independent-backup-verifier",
    "conformance/rust",
    "conformance/v2/fixture",
    "integrations/pliegors",
    "crates/hyphae-cli",
    "crates/hyphae-client",
    "crates/hyphae-contracts",
    "crates/hyphae-core",
    "crates/hyphae-engine",
    "crates/hyphae-native-ann",
    "crates/hyphae-native-blobs",
    "crates/hyphae-native-catalog",
    "crates/hyphae-native-btree",
    "crates/hyphae-native-mvcc",
    "crates/hyphae-native-manifest",
    "crates/hyphae-native-daemon",
    "crates/hyphae-native-pages",
    "crates/hyphae-native-product",
    "crates/hyphae-native-protocol",
    "crates/hyphae-native-records",
    "crates/hyphae-native-runtime",
    "crates/hyphae-native-types",
    "crates/hyphae-native-wal",
    "crates/hyphae-query",
    "crates/hyphae-retrieval",
    "crates/hyphae-server",
    "crates/hyphae-storage",
]
default-members = ["crates/hyphae-cli"]

[workspace.package]
version = "3.0.0"
edition = "2024"
rust-version = "1.89.0"
authors = ["Celiums Solutions LLC"]
license = "Apache-2.0"
repository = "https://github.com/Hyphae-Research-Foundation/hyphae"
homepage = "https://hyphae.dev"
readme = "README.md"
keywords = ["database", "embedded", "local-first", "provenance", "verification"]
categories = ["database-implementations"]
publish = true

[workspace.dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.9", features = ["json", "tokio"] }
base64 = "0.23.0"
blake3 = "1.8.5"
clap = { version = "4.6.1", features = ["derive", "env"] }
crossterm = "0.29.0"
crc32c = "0.6.8"
fs4 = "1.1.0"
futures-channel = "0.3.31"
futures-util = "0.3.31"
getrandom = "0.3.4"
http = "1.4.0"
interprocess = { version = "2.4.3", features = ["tokio"] }
hyphae-contracts = { path = "crates/hyphae-contracts", version = "=3.0.0" }
hyphae-client = { path = "crates/hyphae-client", version = "=3.0.0" }
hyphae-core = { path = "crates/hyphae-core", version = "=3.0.0" }
hyphae-engine = { path = "crates/hyphae-engine", version = "=3.0.0" }
hyphae-native-ann = { path = "crates/hyphae-native-ann", version = "=3.0.0" }
hyphae-native-blobs = { path = "crates/hyphae-native-blobs", version = "=3.0.0" }
hyphae-native-catalog = { path = "crates/hyphae-native-catalog", version = "=3.0.0" }
hyphae-native-btree = { path = "crates/hyphae-native-btree", version = "=3.0.0" }
hyphae-native-mvcc = { path = "crates/hyphae-native-mvcc", version = "=3.0.0" }
hyphae-native-manifest = { path = "crates/hyphae-native-manifest", version = "=3.0.0" }
hyphae-native-daemon = { path = "crates/hyphae-native-daemon", version = "=3.0.0" }
hyphae-native-pages = { path = "crates/hyphae-native-pages", version = "=3.0.0" }
hyphae-native-product = { path = "crates/hyphae-native-product", version = "=3.0.0" }
hyphae-native-protocol = { path = "crates/hyphae-native-protocol", version = "=3.0.0" }
hyphae-native-records = { path = "crates/hyphae-native-records", version = "=3.0.0" }
hyphae-native-runtime = { path = "crates/hyphae-native-runtime", version = "=3.0.0" }
hyphae-native-types = { path = "crates/hyphae-native-types", version = "=3.0.0" }
hyphae-native-wal = { path = "crates/hyphae-native-wal", version = "=3.0.0" }
hyphae-query = { path = "crates/hyphae-query", version = "=3.0.0" }
hyphae-retrieval = { path = "crates/hyphae-retrieval", version = "=3.0.0" }
hyphae-server = { path = "crates/hyphae-server", version = "=3.0.0" }
hyphae-storage = { path = "crates/hyphae-storage", version = "=3.0.0" }
libm = "0.2.16"
libc = "0.2.186"
nix = { version = "0.31.3", default-features = false, features = ["sched"] }
proptest = "1.6.0"
redb = "4.1.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
rustix = { version = "1.0.8", default-features = false }
same-file = "1.0.6"
schemars = { version = "1.2.1", features = ["uuid1"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml_ng = "0.10.0"
subtle = "2.6.1"
thiserror = "2.0.18"
unicode-casefold = "0.2.0"
unicode-normalization = "0.1.25"
widestring = "1.2.1"
windows-permissions = "=0.2.4"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
tokio = { version = "1.49.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["io"] }
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["catch-panic", "cors", "limit", "request-id", "timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.23.5", features = ["serde", "v7"] }

[patch.crates-io]
hyphae-cli = { path = "crates/hyphae-cli" }
hyphae-client = { path = "crates/hyphae-client" }
hyphae-contracts = { path = "crates/hyphae-contracts" }
hyphae-core = { path = "crates/hyphae-core" }
hyphae-engine = { path = "crates/hyphae-engine" }
hyphae-native-ann = { path = "crates/hyphae-native-ann" }
hyphae-native-blobs = { path = "crates/hyphae-native-blobs" }
hyphae-native-btree = { path = "crates/hyphae-native-btree" }
hyphae-native-catalog = { path = "crates/hyphae-native-catalog" }
hyphae-native-daemon = { path = "crates/hyphae-native-daemon" }
hyphae-native-manifest = { path = "crates/hyphae-native-manifest" }
hyphae-native-mvcc = { path = "crates/hyphae-native-mvcc" }
hyphae-native-pages = { path = "crates/hyphae-native-pages" }
hyphae-native-product = { path = "crates/hyphae-native-product" }
hyphae-native-protocol = { path = "crates/hyphae-native-protocol" }
hyphae-native-records = { path = "crates/hyphae-native-records" }
hyphae-native-runtime = { path = "crates/hyphae-native-runtime" }
hyphae-native-types = { path = "crates/hyphae-native-types" }
hyphae-native-wal = { path = "crates/hyphae-native-wal" }
hyphae-query = { path = "crates/hyphae-query" }
hyphae-retrieval = { path = "crates/hyphae-retrieval" }
hyphae-server = { path = "crates/hyphae-server" }
hyphae-storage = { path = "crates/hyphae-storage" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
