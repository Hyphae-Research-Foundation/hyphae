# SPDX-License-Identifier: Apache-2.0
#
# Standalone workspace: intentionally NOT a member of the Hyphae root
# workspace. Baselines (SQLite, DuckDB, Redis, Tantivy) must never enter the
# product dependency graph; this harness exists only to produce dedicated
# hardware evidence receipts.
[workspace]

[package]
name = "hyphae-baseline-harness"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "Dedicated-hardware baseline benchmark harness for Hyphae native engines"
publish = false

[dependencies]
hyphae-native-runtime = { path = "../../crates/hyphae-native-runtime" }
hyphae-native-types = { path = "../../crates/hyphae-native-types" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Baselines. Bundled engines pin the exact measured library version.
rusqlite = { version = "0.37", features = ["bundled"] }
duckdb = { version = "1.4.1", features = ["bundled"] }
redis = { version = "0.32", default-features = false }
tantivy = "0.25"

[profile.release]
lto = "thin"
codegen-units = 1
debug = false
