# Valkey 9.1.2 external baseline: AOF fsync on every write.
bind 127.0.0.1
protected-mode yes
port 0
unixsocket /run/hyphae-valkey-always.sock
unixsocketperm 700
timeout 0
daemonize yes
supervised no
pidfile /run/hyphae-valkey-always.pid
logfile /mnt/nvme/valkey-always/valkey.log
databases 1
save ""
dir /mnt/nvme/valkey-always
appendonly yes
appendfsync always
maxmemory 0
maxmemory-policy noeviction
