# Valkey 9.1.2 external baseline: AOF with asynchronous every-second fsync.
bind 127.0.0.1
protected-mode yes
port 0
unixsocket /run/hyphae-valkey-everysec.sock
unixsocketperm 700
timeout 0
daemonize yes
supervised no
pidfile /run/hyphae-valkey-everysec.pid
logfile /mnt/nvme/valkey-everysec/valkey.log
databases 1
save ""
dir /mnt/nvme/valkey-everysec
appendonly yes
appendfsync everysec
maxmemory 0
maxmemory-policy noeviction
