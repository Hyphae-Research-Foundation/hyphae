# Valkey 9.1.2 external baseline: no persistence acknowledgement.
bind 127.0.0.1
protected-mode yes
port 0
unixsocket /run/hyphae-valkey-no.sock
unixsocketperm 700
timeout 0
daemonize yes
supervised no
pidfile /run/hyphae-valkey-no.pid
logfile /mnt/nvme/valkey-no/valkey.log
databases 1
save ""
dir /mnt/nvme/valkey-no
appendonly no
appendfsync no
maxmemory 0
maxmemory-policy noeviction
