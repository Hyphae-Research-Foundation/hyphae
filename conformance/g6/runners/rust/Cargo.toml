[package]
name = "hyphae-native-g6-conformance-runner"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
hyphae-native-product = { path = "../../../../crates/hyphae-native-product" }
hyphae-native-catalog = { path = "../../../../crates/hyphae-native-catalog" }
hyphae-native-types = { path = "../../../../crates/hyphae-native-types" }
hyphae-client = { path = "../../../../crates/hyphae-client" }
hyphae-native-daemon = { path = "../../../../crates/hyphae-native-daemon" }
hyphae-server = { path = "../../../../crates/hyphae-server" }
hyphae-native-protocol = { path = "../../../../crates/hyphae-native-protocol" }
serde_json = "1.0.150"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
interprocess = { version = "2.4.3", features = ["tokio"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-webpki-roots"] }

[workspace]
