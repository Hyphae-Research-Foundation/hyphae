[package]
name = "hyphae-native-g7-runner"
version = "0.0.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[dependencies]
blake3 = "1.8.5"
futures-util = "0.3.31"
hyphae-native-catalog = { path = "../../../../crates/hyphae-native-catalog" }
hyphae-native-daemon = { path = "../../../../crates/hyphae-native-daemon" }
hyphae-native-product = { path = "../../../../crates/hyphae-native-product" }
hyphae-native-runtime = { path = "../../../../crates/hyphae-native-runtime" }
hyphae-native-types = { path = "../../../../crates/hyphae-native-types" }
hyphae-client = { path = "../../../../crates/hyphae-client" }
ring = "0.17.14"
serde_json = "1.0.150"
stats_alloc = "0.1.10"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["sched"] }

[workspace]
