        default: { $ref: "#/components/responses/ProductError" }
  /v2/proofs/verify:
    parameters: [{ $ref: "#/components/parameters/ProtocolMinor" }]
    post:
      tags: [proofs]
      operationId: verifyNativeProofV2
      security: [{ BearerAuth: [] }, {}]
      requestBody: { $ref: "#/components/requestBodies/ProductRequest" }
      responses:
        "200": { $ref: "#/components/responses/ProductResponse" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AuthorizationDenied" }
        default: { $ref: "#/components/responses/ProductError" }
  /v2/transactions/status:
    parameters: [{ $ref: "#/components/parameters/ProtocolMinor" }]
    post:
      tags: [administration]
      operationId: transactionStatusV2
      security: [{ BearerAuth: [] }, {}]
      requestBody: { $ref: "#/components/requestBodies/ProductRequest" }
      responses:
        "200": { $ref: "#/components/responses/ProductResponse" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AuthorizationDenied" }
        default: { $ref: "#/components/responses/ProductError" }
  /v2/security/keys:
    parameters: [{ $ref: "#/components/parameters/ProtocolMinor" }]
    post:
      tags: [security]
      operationId: manageNativeApiKeysV2
      description: >-
        Protocol minor 3 API-key lifecycle. Issue and rotate are explicit Start
        and Activate operations. Start returns one secret once while the key is
        inactive; replay returns secret_delivery_consumed. Clients must create
        and synchronize a restricted file and its parent before Activate.
        Filesystem paths are structurally absent from every request and receipt.
        Every self and administrative Issue Start, Issue Activate, Issue Abort,
        Rotate Start, Rotate Activate, Rotate Abort, and Revoke operation is
        accepted only by this family. The family requires strict durability and
        catalog-managed authority. Generic /v2/execute rejects these variants.
      security: [{ BearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/ProductRequest" }
      responses:
        "200":
          $ref: "#/components/responses/ApiKeyLifecycleResponse"
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AuthorizationDenied" }
        default: { $ref: "#/components/responses/ProductError" }
  /v2/read-stream:
    parameters: [{ $ref: "#/components/parameters/ProtocolMinor" }]
    post:
      tags: [sql, catalog, structures, search]
      operationId: streamNativeReadV2
      security: [{ BearerAuth: [] }, {}]
      requestBody: { $ref: "#/components/requestBodies/ProductRequest" }
      responses:
        "200":
          description: Provisional records followed by mandatory completion
          headers:
            X-Hyphae-Request-Id: { $ref: "#/components/headers/RequestId" }
            X-Hyphae-Protocol-Minor: { $ref: "#/components/headers/ProtocolMinor" }
            X-Hyphae-Stream-Completion:
              schema: { const: required }
          content:
            application/x-ndjson:
              schema:
                $ref: "../json-schema/read-stream-v2.schema.json"
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AuthorizationDenied" }
        default: { $ref: "#/components/responses/ProductError" }
components:
  parameters:
    ProtocolMinor:
      name: X-Hyphae-Protocol-Minor
      in: header
      required: true
      description: Exact Native product protocol minor offered by the client
      schema: { type: string, const: "3" }
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: hyp1_<32-lowercase-hex-key-id>_<64-lowercase-hex-secret>
      description: >-
        Automatically mandatory when the Native access-control catalog is
        bootstrapped, and optional only for a pre-bootstrap unmanaged service.
        Canonical hyp1 is always parsed without fallback. During the exact 1.2
        migration window, durable dual_window plus explicit server
        configuration may separately accept the migrated opaque bearer on
        Native HTTP loopback only.
  headers:
    RequestId:
      required: true
      schema:
        type: string
        pattern: "^[1-9][0-9]{0,38}$"
    ProtocolMinor:
      required: true
      schema: { type: string, const: "3" }
  requestBodies:
    ProductRequest:
      required: true
      content:
        application/vnd.hyphae.product-v1:
          schema:
            type: string
            format: binary
  responses:
    AuthenticationRequired:
      description: Missing, malformed, unknown, revoked outside exact terminal replay, or incorrect managed API-key credential
      headers:
        X-Hyphae-Request-Id: { $ref: "#/components/headers/RequestId" }
        X-Hyphae-Protocol-Minor: { $ref: "#/components/headers/ProtocolMinor" }
        WWW-Authenticate:
          required: true
          schema: { type: string, const: 'Bearer realm="hyphae-native-v2"' }
      content:
        application/json:
          schema:
            $ref: "../json-schema/product-error-v2.schema.json"
        application/vnd.hyphae.error-v1:
          schema: { type: string, format: binary }
    AuthorizationDenied:
      description: Authenticated principal lacks permission or an already-open retained authority was revoked
      headers:
        X-Hyphae-Request-Id: { $ref: "#/components/headers/RequestId" }
        X-Hyphae-Protocol-Minor: { $ref: "#/components/headers/ProtocolMinor" }
      content:
        application/json:
          schema:
            $ref: "../json-schema/product-error-v2.schema.json"
        application/vnd.hyphae.error-v1:
          schema: { type: string, format: binary }
    ProductResponse:
      description: Canonical HYPRSP01 Product response
      headers:
        X-Hyphae-Request-Id: { $ref: "#/components/headers/RequestId" }
        X-Hyphae-Protocol-Minor: { $ref: "#/components/headers/ProtocolMinor" }
        X-Hyphae-Session-Id:
          description: Opaque principal-bound HTTP session identity when state is retained
          schema: { type: string, pattern: "^[0-9a-f]{32}$" }
      content:
        application/vnd.hyphae.product-v1:
          schema:
            type: string
            format: binary
    ApiKeyLifecycleResponse:
      description: Canonical HYPRSP01 lifecycle response; Start contains one-time secret bytes
      headers:
        X-Hyphae-Request-Id: { $ref: "#/components/headers/RequestId" }
        X-Hyphae-Protocol-Minor: { $ref: "#/components/headers/ProtocolMinor" }
        Cache-Control:
          required: true
          schema: { const: "no-store, private, max-age=0" }
        Pragma:
          required: true
          schema: { const: "no-cache" }
      content:
        application/vnd.hyphae.product-v1:
          schema: { type: string, format: binary }
    ProductError:
      description: >-
        ProductError field parity; binary HYPERR01 is available by Accept
        negotiation. Managed authentication failures are HTTP 401 with a Bearer
        challenge; post-authentication permission or authority loss is HTTP 403.
      headers:
        X-Hyphae-Request-Id: { $ref: "#/components/headers/RequestId" }
        X-Hyphae-Protocol-Minor: { $ref: "#/components/headers/ProtocolMinor" }
      content:
        application/json:
          schema:
            $ref: "../json-schema/product-error-v2.schema.json"
        application/vnd.hyphae.error-v1:
          schema:
            type: string
            format: binary
