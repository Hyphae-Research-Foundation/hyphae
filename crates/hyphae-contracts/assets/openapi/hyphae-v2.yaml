        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AuthorizationDenied" }
        default: { $ref: "#/components/responses/ProductError" }
  /v2/search/collection:
    parameters: [{ $ref: "#/components/parameters/ProtocolMinor" }]
