# SPDX-License-Identifier: Apache-2.0
openapi: 3.1.0
info:
  title: Hyphae Native HTTP API
  version: 2.0.0-alpha
  description: >-
    Optional loopback-first adapter over one existing NativeProductService.
    It never opens HyphaeEngine, a second NativeProduct, or format-2 state.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
x-hyphae-authority: existing-one-owner-native-product-service
x-hyphae-v1-compatibility:
  exact-mappings-only: true
  unmappable-fails-explicitly: true
  opens-format-2-state: false
x-hyphae-provisional-streams: >-
  Every application/x-ndjson data record is provisional. Success exists only
  after a terminal completion record with status complete.
x-hyphae-protocol-minor: >-
  Clients offer their supported protocol minors in X-Hyphae-Protocol-Minor as
  bounded canonical decimal tokens (at most eight, comma separation tolerated,
  no duplicates, no leading zeros). The server selects the highest offered
  minor it serves, rejects an offer without a served member before
  authentication or dispatch, and emits the selected minor on every response.
  This build serves exactly minor 3.
x-hyphae-authentication-modes:
  unmanaged: >-
    Before bootstrap, new preserves the legacy adapter and an optional fixed
    bearer may gate trusted full authority.
  managed: >-
    After bootstrap, new automatically requires one canonical hyp1 API key on
    every request and derives product sessions from the durable access-control
    catalog. new_managed forces the same policy before bootstrap. The plaintext
    adapter is loopback-only; remote exposure requires a TLS-terminating proxy.
    Authentication and request admission are bounded to 256 active tasks.
    Revoked canonical candidates retain only opaque pending state. Every method
    and path except POST /v2/security/keys rejects it before handler or product
    dispatch. That route accepts it only when the bounded body proves an exact
    durable terminal self-replay; every other body is the same challenged 401
    as an unknown credential.
  legacy-migration-1.2: >-
    Native HTTP only. Durable dual_window plus an explicitly configured
    restricted legacy-bearer file may authenticate synthetic legacy-owner.
    The bearer has no durable principal/key IDs, cannot manage security or
    ownership, and terminal revocation invalidates retained sessions. UDS,
    named pipe, non-loopback plaintext, never_enabled, revoked, and 1.3 deny it.
servers:
  - url: http://127.0.0.1:8788
    description: Default loopback-only listener
security: [{ BearerAuth: [] }, {}]
tags:
  - name: discovery
  - name: catalog
  - name: sql
  - name: structures
  - name: search
  - name: administration
  - name: proofs
  - name: security
paths:
  /v2/capabilities:
    parameters: [{ $ref: "#/components/parameters/ProtocolMinor" }]
    get:
      tags: [discovery]
      operationId: nativeCapabilitiesV2
      security: [{ BearerAuth: [] }, {}]
      responses:
        "200": { $ref: "#/components/responses/ProductResponse" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AuthorizationDenied" }
        default: { $ref: "#/components/responses/ProductError" }
  /v2/execute:
    parameters: [{ $ref: "#/components/parameters/ProtocolMinor" }]
    post:
      tags: [administration]
      operationId: executeNativeOperationV2
      description: >-
        Generic Native operation family. API-key lifecycle variants are not
        accepted here and must use /v2/security/keys.
      security: [{ BearerAuth: [] }, {}]
      requestBody: { $ref: "#/components/requestBodies/ProductRequest" }
      responses:
        "200": { $ref: "#/components/responses/ProductResponse" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AuthorizationDenied" }
        default: { $ref: "#/components/responses/ProductError" }
  /v2/catalog:
    parameters: [{ $ref: "#/components/parameters/ProtocolMinor" }]
    post:
      tags: [catalog]
      operationId: executeCatalogV2
      security: [{ BearerAuth: [] }, {}]
      requestBody: { $ref: "#/components/requestBodies/ProductRequest" }
      responses:
        "200": { $ref: "#/components/responses/ProductResponse" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AuthorizationDenied" }
        default: { $ref: "#/components/responses/ProductError" }
      description: >-
        Protocol minor 3 adds catalog.visible_list. Its cursor is one bounded
        opaque byte token bound to durable key/session authority, authorization
        epoch, immutable snapshot, filters, operation family, and last visible
        ObjectId. It never exposes snapshot or physical traversal accounting.
  /v2/sql:
    parameters: [{ $ref: "#/components/parameters/ProtocolMinor" }]
    post:
      tags: [sql]
      operationId: executeSqlV2
      security: [{ BearerAuth: [] }, {}]
      requestBody: { $ref: "#/components/requestBodies/ProductRequest" }
      responses:
        "200": { $ref: "#/components/responses/ProductResponse" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AuthorizationDenied" }
        default: { $ref: "#/components/responses/ProductError" }
  /v2/structures:
    parameters: [{ $ref: "#/components/parameters/ProtocolMinor" }]
    post:
      tags: [structures]
      operationId: executeStructureV2
      security: [{ BearerAuth: [] }, {}]
      requestBody: { $ref: "#/components/requestBodies/ProductRequest" }
      responses:
        "200": { $ref: "#/components/responses/ProductResponse" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AuthorizationDenied" }
        default: { $ref: "#/components/responses/ProductError" }
  /v2/search:
    parameters: [{ $ref: "#/components/parameters/ProtocolMinor" }]
    post:
      tags: [search]
      operationId: executeSearchV2
      security: [{ BearerAuth: [] }, {}]
      requestBody: { $ref: "#/components/requestBodies/ProductRequest" }
      responses:
