openapi: 3.1.0
info:
  title: Hyphae Native HTTP API
  version: 2.0.0-alpha
  description: >-
    Optional loopback-first adapter over one existing NativeProductService.
    It never opens HyphaeEngine, a second NativeProduct, or format-2 state.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
x-hyphae-authority: existing-one-owner-native-product-service
x-hyphae-v1-compatibility:
  exact-mappings-only: true
  unmappable-fails-explicitly: true
  opens-format-2-state: false
x-hyphae-provisional-streams: >-
  Every application/x-ndjson data record is provisional. Success exists only
  after a terminal completion record with status complete.
x-hyphae-authentication-modes:
  unmanaged: >-
    Before bootstrap, new preserves the legacy adapter and an optional fixed
    bearer may gate trusted full authority.
  managed: >-
    After bootstrap, new automatically requires one canonical hyp1 API key on
    every request and derives product sessions from the durable access-control
    catalog. new_managed forces the same policy before bootstrap. The plaintext
    adapter is loopback-only; remote exposure requires a TLS-terminating proxy.
servers:
  - url: http://127.0.0.1:8788
    description: Default loopback-only listener
security: [{ BearerAuth: [] }, {}]
tags:
  - name: discovery
  - name: catalog
  - name: sql
  - name: structures
  - name: search
  - name: administration
  - name: proofs
paths:
  /v2/capabilities:
    get:
      tags: [discovery]
      operationId: nativeCapabilitiesV2
      security: [{ BearerAuth: [] }, {}]
      responses:
        "200": { $ref: "#/components/responses/ProductResponse" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AuthorizationDenied" }
        default: { $ref: "#/components/responses/ProductError" }
  /v2/execute:
    post:
      tags: [administration]
      operationId: executeNativeOperationV2
      security: [{ BearerAuth: [] }, {}]
      requestBody: { $ref: "#/components/requestBodies/ProductRequest" }
      responses:
        "200": { $ref: "#/components/responses/ProductResponse" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AuthorizationDenied" }
        default: { $ref: "#/components/responses/ProductError" }
  /v2/catalog:
