# SPDX-License-Identifier: Apache-2.0
[package]
name = "hyphae-native-runtime"
description = "Experimental native transactional runtime joining Hyphae's relational, structure, and search kernels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/hyphae-native-runtime"
publish.workspace = true
include = [
    "Cargo.toml",
    "examples/**",
    "LICENSE",
    "LICENSE-DOCUMENTATION",
    "LICENSE-POLICY.md",
    "README.md",
    "THIRD_PARTY_NOTICES.md",
    "src/**",
    "tests/**",
]

[dependencies]
blake3.workspace = true
crc32c.workspace = true
getrandom.workspace = true
hyphae-native-ann.workspace = true
hyphae-native-blobs.workspace = true
hyphae-native-btree.workspace = true
hyphae-native-catalog.workspace = true
hyphae-native-manifest.workspace = true
hyphae-native-mvcc.workspace = true
hyphae-native-pages.workspace = true
hyphae-native-records.workspace = true
hyphae-native-types.workspace = true
hyphae-native-wal.workspace = true
thiserror.workspace = true
unicode-casefold.workspace = true
unicode-normalization.workspace = true
serde.workspace = true
serde_json.workspace = true
same-file.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
nix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-permissions.workspace = true
windows-sys.workspace = true

[lints]
workspace = true
