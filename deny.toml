[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    # Zero-clause OS IPC support used transitively by interprocess.
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Mozilla/CCADB root-certificate data bundled by webpki-roots.
    "CDLA-Permissive-2.0",
    # Hyphae workspace packages.
    "AGPL-3.0-only",
    "ISC",
    "MIT",
    "MPL-2.0",
    # LLVM libFuzzer bundled by the development-only libfuzzer-sys crate.
    "NCSA",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Same-layer workspace dev dependencies are path-only so Cargo excludes them
# from the published dependency graph. Registry wildcards remain denied.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
