# SPDX-License-Identifier: Apache-2.0
[workspace]

[package]
name = "hyphae-embed"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Attested local embedding and reranking for Hyphae"
publish = false

[dependencies]
anyhow = "1"
blake3 = "1"
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

[profile.release]
lto = "thin"
