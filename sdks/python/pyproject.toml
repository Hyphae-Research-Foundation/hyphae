# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hyphae-sdk"
version = "2.1.0"
description = "Bounded Python client for Hyphae v1 and Native v2 APIs"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-DOCUMENTATION", "LICENSE-POLICY.md", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "Celiums Solutions LLC" },
]
keywords = ["database", "sql", "vector-search", "rag", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
providers = ["blake3>=0.4"]
langchain = ["blake3>=0.4", "langchain-core>=0.3"]
llamaindex = ["blake3>=0.4", "llama-index-core>=0.11"]

[project.urls]
Homepage = "https://hyphae.dev"
Documentation = "https://github.com/Hyphae-Research-Foundation/hyphae/tree/main/docs"
Repository = "https://github.com/Hyphae-Research-Foundation/hyphae"
Issues = "https://github.com/Hyphae-Research-Foundation/hyphae/issues"
Changelog = "https://github.com/Hyphae-Research-Foundation/hyphae/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hyphae_sdk = ["py.typed"]
